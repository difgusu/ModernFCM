<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="calcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="calcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="calcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Card background -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#calcBg)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2"/>
  <!-- Display Screen -->
  <rect x="8" y="7" width="32" height="11" rx="4" fill="#082f49" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="36" y="16" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="800" text-anchor="end" filter="url(#calcGlow)">72.5</text>
  <!-- Row 1 Buttons -->
  <rect x="8" y="22" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="11.5" y="26.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">7</text>
  <rect x="17" y="22" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="20.5" y="26.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">8</text>
  <rect x="26" y="22" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="29.5" y="26.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">9</text>
  <rect x="34" y="22" width="6" height="6" rx="2" fill="url(#calcCyan)"/>
  <text x="37" y="26.8" fill="#0f172a" font-family="sans-serif" font-size="6" font-weight="800" text-anchor="middle">&divide;</text>
  <!-- Row 2 Buttons -->
  <rect x="8" y="30" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="11.5" y="34.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">4</text>
  <rect x="17" y="30" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="20.5" y="34.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">5</text>
  <rect x="26" y="30" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="29.5" y="34.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">6</text>
  <rect x="34" y="30" width="6" height="6" rx="2" fill="url(#calcCyan)"/>
  <text x="37" y="34.8" fill="#0f172a" font-family="sans-serif" font-size="6" font-weight="800" text-anchor="middle">&times;</text>
  <!-- Row 3 Buttons -->
  <rect x="8" y="38" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="11.5" y="42.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">1</text>
  <rect x="17" y="38" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="20.5" y="42.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">2</text>
  <rect x="26" y="38" width="7" height="6" rx="2" fill="#1e293b" stroke="rgba(255,255,255,0.2)"/>
  <text x="29.5" y="42.8" fill="#e2e8f0" font-family="sans-serif" font-size="5" font-weight="700" text-anchor="middle">3</text>
  <rect x="34" y="38" width="6" height="6" rx="2" fill="url(#calcGold)"/>
  <text x="37" y="42.8" fill="#0f172a" font-family="sans-serif" font-size="6" font-weight="800" text-anchor="middle">=</text>
</svg>
