<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6BE"/>
      <stop offset="28%" stop-color="#F5C438"/>
      <stop offset="50%" stop-color="#FFF9D8"/>
      <stop offset="75%" stop-color="#C28C10"/>
      <stop offset="100%" stop-color="#784E00"/>
    </linearGradient>

    <radialGradient id="redRing" cx="48%" cy="42%" r="52%">
      <stop offset="55%" stop-color="#DE2836"/>
      <stop offset="85%" stop-color="#BD1A26"/>
      <stop offset="100%" stop-color="#911019"/>
    </radialGradient>

    <radialGradient id="whiteRing" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5F6F8"/>
      <stop offset="100%" stop-color="#D9DDE2"/>
    </radialGradient>

    <radialGradient id="greenDisc" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00A850"/>
      <stop offset="60%" stop-color="#009246"/>
      <stop offset="100%" stop-color="#006C32"/>
    </radialGradient>

    <linearGradient id="cockadeSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.32"/>
    </filter>

    <clipPath id="circleClip">
      <circle cx="128" cy="128" r="111"/>
    </clipPath>
  </defs>

  <g filter="url(#dropShadow)">
    <circle cx="128" cy="128" r="115" fill="url(#goldRim)"/>
    <circle cx="128" cy="128" r="112" fill="#422E00" opacity="0.35"/>

    <g clip-path="url(#circleClip)">
      <circle cx="128" cy="128" r="111" fill="url(#redRing)"/>
      <circle cx="128" cy="128" r="74" fill="url(#whiteRing)"/>
      <circle cx="128" cy="128" r="74" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.15"/>
      <circle cx="128" cy="128" r="40" fill="url(#greenDisc)"/>
      <circle cx="128" cy="128" r="40" fill="none" stroke="#000000" stroke-width="1.5" opacity="0.18"/>

      <circle cx="128" cy="128" r="74.5" fill="none" stroke="url(#goldRim)" stroke-width="1.5" opacity="0.85"/>
      <circle cx="128" cy="128" r="40.5" fill="none" stroke="url(#goldRim)" stroke-width="1.5" opacity="0.85"/>

      <path d="M 20 50 Q 128 10 236 50 Q 210 170 128 190 Q 40 160 20 50 Z" fill="url(#cockadeSheen)" opacity="0.65"/>
      <ellipse cx="104" cy="74" rx="46" ry="22" transform="rotate(-25 104 74)" fill="#FFFFFF" opacity="0.25"/>
    </g>

    <circle cx="128" cy="128" r="111" fill="none" stroke="url(#goldRim)" stroke-width="2"/>
  </g>
</svg>