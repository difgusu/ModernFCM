<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="torsoClip">
      <path d="M 76 28 L 180 28 L 194 116 L 192 232 C 156 238, 100 238, 64 232 L 62 116 Z"/>
    </clipPath>

    <clipPath id="leftSleeveClip">
      <path d="M 76 28 L 14 86 L 42 120 L 62 116 Z"/>
    </clipPath>

    <clipPath id="rightSleeveClip">
      <path d="M 180 28 L 242 86 L 214 120 L 194 116 Z"/>
    </clipPath>

    <linearGradient id="bodyLighting" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="14%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="86%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="verticalHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="leftSleeveLighting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="rightSleeveLighting" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <!-- 1. LEFT SLEEVE -->
    <g>
      <path d="M 76 28 L 14 86 L 42 120 L 62 116 Z" fill="#94A3B8"/>
      <g clip-path="url(#leftSleeveClip)">
        <rect x="0" y="20" width="80" height="110" fill="url(#leftSleeveLighting)" mix-blend-mode="multiply"/>
      </g>
      <path d="M 14 86 L 8 93 L 36 127 L 42 120 Z" fill="#64748B" stroke="#94A3B8" stroke-width="0.8"/>
      <line x1="14" y1="86" x2="42" y2="120" stroke="#000000" stroke-width="1.2" stroke-opacity="0.25"/>
      <path d="M 76 28 L 14 86 L 8 93 L 36 127 L 42 120 L 62 116" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>

    <!-- 2. RIGHT SLEEVE -->
    <g>
      <path d="M 180 28 L 242 86 L 214 120 L 194 116 Z" fill="#94A3B8"/>
      <g clip-path="url(#rightSleeveClip)">
        <rect x="176" y="20" width="80" height="110" fill="url(#rightSleeveLighting)" mix-blend-mode="multiply"/>
      </g>
      <path d="M 242 86 L 248 93 L 220 127 L 214 120 Z" fill="#64748B" stroke="#94A3B8" stroke-width="0.8"/>
      <line x1="242" y1="86" x2="214" y2="120" stroke="#000000" stroke-width="1.2" stroke-opacity="0.25"/>
      <path d="M 180 28 L 242 86 L 248 93 L 220 127 L 214 120 L 194 116" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>

    <!-- 3. MAIN TORSO -->
    <g>
      <path d="M 76 28 L 180 28 L 194 116 L 192 232 C 156 238, 100 238, 64 232 L 62 116 Z" fill="#CBD5E1"/>
      <g clip-path="url(#torsoClip)">
        <rect x="58" y="20" width="140" height="225" fill="#CBD5E1"/>
        <rect x="58" y="20" width="140" height="225" fill="url(#bodyLighting)" mix-blend-mode="multiply"/>
        <rect x="58" y="20" width="140" height="225" fill="url(#verticalHighlight)" mix-blend-mode="screen"/>
        <path d="M 62 116 C 66 135, 66 155, 64 175" fill="none" stroke="#000000" stroke-width="4" stroke-opacity="0.15"/>
        <path d="M 194 116 C 190 135, 190 155, 192 175" fill="none" stroke="#000000" stroke-width="4" stroke-opacity="0.15"/>
        <path d="M 64 228 C 100 234, 156 234, 192 228" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.2"/>
      </g>
      <path d="M 76 28 L 180 28 L 194 116 L 192 232 C 156 238, 100 238, 64 232 L 62 116 Z" fill="none" stroke="#000000" stroke-width="1.8" stroke-opacity="0.3"/>
    </g>

    <!-- 4. INNER COLLAR HOLE -->
    <path d="M 102 24 C 112 36, 144 36, 154 24 C 144 18, 112 18, 102 24 Z" fill="#334155" stroke="#000000" stroke-width="0.8" stroke-opacity="0.3"/>

    <!-- 5. V-NECK INSERT / BUTTON PLACKET -->
    <path d="M 122 28 L 134 28 L 131 66 L 128 72 L 125 66 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.8"/>
    <line x1="128" y1="32" x2="128" y2="64" stroke="#000000" stroke-width="1" stroke-opacity="0.2"/>
    <circle cx="128" cy="42" r="1.5" fill="#000000" opacity="0.3"/>
    <circle cx="128" cy="54" r="1.5" fill="#000000" opacity="0.3"/>

    <!-- 6. POLO COLLAR -->
    <path d="M 100 20 C 90 22, 84 26, 80 30 L 112 60 L 128 36 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
    <path d="M 80 30 L 112 60 L 128 36" stroke="#000000" stroke-width="1.2" stroke-opacity="0.2" fill="none"/>
    <path d="M 156 20 C 166 22, 172 26, 176 30 L 144 60 L 128 36 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
    <path d="M 176 30 L 144 60 L 128 36" stroke="#000000" stroke-width="1.2" stroke-opacity="0.2" fill="none"/>
    <path d="M 112 60 L 128 76 L 144 60 L 128 66 Z" fill="#000000" opacity="0.2"/>
  </g>
</svg>
